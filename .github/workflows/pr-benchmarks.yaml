# Per-PR benchmark delta.
#
# benchmarks.yaml graphs the BDN trend on push (backward-looking: regressions
# surface AFTER they merge). This is the forward-looking signal: run the same
# micro-benchmarks on the PR's HEAD and on the merge-base with the target
# branch, compute per-benchmark deltas, and post a table comment on the PR
# (replaced on each push, not appended).
#
# Scope: the DB-free micro-benchmarks (PropertyGetter, SliceList) — fast and
# deterministic per-PR. The end-to-end LoaderBenchmarks (heavier, even via the
# no-op wrapper) stays on the nightly benchmarks.yaml trend.
#
# Gate (#234): every PR still gets the delta comment. The job then FAILS when a
# benchmark regresses past a threshold - mean time by more than
# MAX_MEAN_REGRESSION_PCT AND by at least MIN_MEAN_DELTA_NS, or allocations by
# more than MAX_ALLOC_REGRESSION_PCT AND by at least MIN_ALLOC_DELTA_BYTES -
# unless the PR carries the `perf-impact-acknowledged` label (a deliberate,
# reviewed regression). The thresholds live in the `env:` of the delta step.
# The percentages sit well above the Short job's ~5% run-to-run noise, and the
# absolute floors keep nanosecond-scale benchmarks from tripping on jitter.
#
# Refs #106, #234.

name: PR benchmarks delta

on:
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/**"
      - "Directory.Build.props"
      - ".github/workflows/pr-benchmarks.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmark PR HEAD vs base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write   # scoped to this job: post / edit the PR comment
    steps:
      - name: Checkout PR HEAD (with base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run benchmarks on base (merge-base with target branch)
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Full (unshallow) fetch of the base branch: --depth=100 could miss the
          # true merge-base on a long-lived PR. Checkout already used fetch-depth: 0.
          git fetch origin "$BASE_REF"
          mb=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "Base merge-base SHA: $mb"
          git checkout "$mb"
          mkdir -p bench/base
          dotnet run --project benchmarks/Wolfgang.Etl.SqlBulkCopy.Benchmarks \
            -c Release -- \
            --filter '*PropertyGetterBenchmarks*' '*SliceListBenchmarks*' \
            --job Short \
            --exporters json \
            --artifacts bench/base

      - name: Run benchmarks on PR HEAD
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout "$HEAD_SHA"
          mkdir -p bench/head
          dotnet run --project benchmarks/Wolfgang.Etl.SqlBulkCopy.Benchmarks \
            -c Release -- \
            --filter '*PropertyGetterBenchmarks*' '*SliceListBenchmarks*' \
            --job Short \
            --exporters json \
            --artifacts bench/head

      - name: Compute per-benchmark delta
        id: delta
        shell: bash
        env:
          # Gate thresholds (#234). A row fails only when BOTH the relative and the
          # absolute limit are exceeded.
          MAX_MEAN_REGRESSION_PCT: "20"
          MIN_MEAN_DELTA_NS: "5"
          MAX_ALLOC_REGRESSION_PCT: "50"
          MIN_ALLOC_DELTA_BYTES: "16"
        run: |
          set -euo pipefail
          python3 - <<'PY' > delta.md
          import glob, json, os

          MAX_MEAN_PCT = float(os.environ["MAX_MEAN_REGRESSION_PCT"])
          MIN_MEAN_NS = float(os.environ["MIN_MEAN_DELTA_NS"])
          MAX_ALLOC_PCT = float(os.environ["MAX_ALLOC_REGRESSION_PCT"])
          MIN_ALLOC_B = float(os.environ["MIN_ALLOC_DELTA_BYTES"])

          def load(root):
              out = {}
              # BenchmarkDotNet's JSON exporter writes *-report-full-compressed.json
              # (matching benchmarks.yaml); *-report.json matches nothing → empty delta.
              for path in glob.glob(f"{root}/results/*-report-full-compressed.json"):
                  with open(path, encoding="utf-8") as fp:
                      d = json.load(fp)
                  for b in d.get("Benchmarks", []):
                      name = b.get("FullName") or b.get("DisplayInfo") or ""
                      stats = b.get("Statistics") or {}
                      mem = b.get("Memory") or {}
                      out[name] = {
                          "meanNs": stats.get("Mean"),
                          "allocBytes": mem.get("BytesAllocatedPerOperation"),
                      }
              return out

          base = load("bench/base")
          head = load("bench/head")
          all_names = sorted(set(base) | set(head))

          def fmt_ns(v):
              if v is None: return "—"
              if v < 1_000: return f"{v:.1f} ns"
              if v < 1_000_000: return f"{v/1_000:.2f} µs"
              return f"{v/1_000_000:.2f} ms"

          def fmt_bytes(v):
              if v is None: return "—"
              if v == 0: return "0 B"
              if v < 1024: return f"{v:.0f} B"
              return f"{v/1024:.2f} KB"

          def pct(new, old):
              if new is None or old is None or old == 0: return "—"
              d = (new - old) / old * 100
              sign = "+" if d >= 0 else ""
              return f"{sign}{d:.1f}%"

          def regressed(new, old, max_pct, min_abs):
              # Both limits must be exceeded: the percentage alone would flap on
              # tiny absolute numbers, the floor alone would miss real slow-downs.
              if new is None or old is None or old <= 0: return False
              return (new - old) / old * 100 > max_pct and (new - old) >= min_abs

          def esc(s): return str(s).replace("|", "\|")
          def short(n): return n.rsplit(".", 1)[-1]

          failures = []
          print("<!-- pr-benchmarks-delta -->")
          print("## PR benchmark delta")
          print()
          if not all_names:
              print("_No benchmarks ran on either side._")
          else:
              print("| Benchmark | Base mean | HEAD mean | Δ mean | Base alloc | HEAD alloc | Δ alloc | Gate |")
              print("|---|---|---|---|---|---|---|---|")
              for n in all_names:
                  b = base.get(n, {}); h = head.get(n, {})
                  slow = regressed(h.get("meanNs"), b.get("meanNs"), MAX_MEAN_PCT, MIN_MEAN_NS)
                  heavy = regressed(h.get("allocBytes"), b.get("allocBytes"), MAX_ALLOC_PCT, MIN_ALLOC_B)
                  if slow or heavy:
                      failures.append(short(n))
                  gate = "fail" if (slow or heavy) else "pass"
                  print("| " + " | ".join([
                      esc(short(n)),
                      esc(fmt_ns(b.get("meanNs"))), esc(fmt_ns(h.get("meanNs"))), esc(pct(h.get("meanNs"), b.get("meanNs"))),
                      esc(fmt_bytes(b.get("allocBytes"))), esc(fmt_bytes(h.get("allocBytes"))), esc(pct(h.get("allocBytes"), b.get("allocBytes"))),
                      gate,
                  ]) + " |")
              print()
              print(f"_Job: Short (~5% variance). Filter: `*PropertyGetter*|*SliceList*` — DB-free micro-benchmarks. Gate: fails on mean > +{MAX_MEAN_PCT:g}% (and ≥ {MIN_MEAN_NS:g} ns) or alloc > +{MAX_ALLOC_PCT:g}% (and ≥ {MIN_ALLOC_B:g} B), unless the PR has the `perf-impact-acknowledged` label (#234)._")
          with open("regressions.txt", "w", encoding="utf-8") as fp:
              fp.write("\n".join(failures))
          PY
          echo "---delta.md---"; cat delta.md

      - name: Comment (or update) on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER='<!-- pr-benchmarks-delta -->'
          existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@delta.md
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file delta.md
          fi

      - name: Gate on regression threshold
        # After the comment step, so the delta table is posted even when this fails.
        shell: bash
        env:
          ACKNOWLEDGED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-impact-acknowledged') }}
        run: |
          set -euo pipefail
          if [ ! -f regressions.txt ]; then
            echo "::error::regressions.txt is missing - the delta step did not evaluate the gate."
            exit 1
          fi
          if [ ! -s regressions.txt ]; then
            echo "No benchmark regressed past the threshold."
            exit 0
          fi
          echo "Benchmarks past the regression threshold:"
          cat regressions.txt; echo
          if [ "$ACKNOWLEDGED" = "true" ]; then
            echo "::warning::Regression acknowledged by the perf-impact-acknowledged label; not failing."
            exit 0
          fi
          echo "::error::Benchmark regression past the threshold (see the PR comment). Fix it, or add the perf-impact-acknowledged label if it is deliberate and reviewed."
          exit 1

      - name: Upload raw BDN outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-benchmarks-raw
          path: bench/
          retention-days: 30
