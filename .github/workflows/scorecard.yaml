name: OSSF Scorecard

# Runs the OpenSSF Scorecard automated security-posture audit and uploads
# the results to the Security tab (Code scanning). Provides a public scorecard
# badge consumers can use to evaluate this package's supply-chain posture.
#
# References:
# - https://github.com/ossf/scorecard-action
# - https://securityscorecards.dev/

on:
  schedule:
    # Sunday 06:00 UTC — matches stryker.yaml's weekly cadence.
    - cron: '0 6 * * 0'
  push:
    branches: [main]
  workflow_dispatch:

# Top-level read-only default; jobs declare narrower writes where required.
# Supersede in-flight runs for the same ref: rapid pushes otherwise stack
# redundant runs of an expensive multi-job workflow.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

# Top-level `read-all` is what the Scorecard action needs to inspect all
# read-scoped repository facets (branch protection, workflow contents, releases,
# code, actions, security events for its own upload). The write scopes are
# declared narrowly on the analysis job below (security-events: write,
# id-token: write for OIDC publish). This is the pattern documented in
# ossf/scorecard-action's own README. zizmor's excessive-permissions rule
# flags the broad read scope; the same-line ignore below suppresses that
# with rationale (the preceding-line form doesn't match this rule's anchor).
permissions: read-all  # zizmor: ignore[excessive-permissions]

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      # Required for uploading results to the code-scanning dashboard.
      security-events: write
      # Required for the OIDC token Scorecard uses to publish results to the
      # public registry (publish_results: true). Not for reading repo content —
      # that is covered by `contents: read` below.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        # SHA-pinned per repo convention for third-party actions.
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results: true uploads to the public Scorecard registry so
          # the badge resolves on the README. Safe — only summary metrics are
          # published, never code.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unfiltered SARIF, retained for audit / debugging even though the
          # code-scanning upload below is filtered.
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Strip won't-fix rule IDs from the SARIF before the code-scanning upload.
      # These rules are structurally unfixable for this repo:
      #   - DangerousWorkflowID: flags the `refs/pull/{n}/head` checkout in
      #     pr.yaml, which is the documented secure pattern for
      #     `pull_request_target` and the whole point of the guard.
      #   - PinnedDependenciesID: flags `dotnet tool install --global` and
      #     `pip install` calls whose ecosystems provide no hash-pin mechanism.
      #   - BranchProtectionID / CodeReviewID: solo-dev repo with no separate
      #     reviewer pool — the "require approvers" checkbox would either be
      #     satisfied by self-approval (defeating the point) or block every
      #     merge.
      #   - CIIBestPracticesID: no OpenSSF badge (chore, not code).
      #   - FuzzingID: repo does have `tests/Wolfgang.Etl.SqlBulkCopy.Tests.Fuzz`,
      #     but Scorecard only recognizes OSS-Fuzz-registered projects.
      #   - SASTID: rolling-window commit coverage above the concern threshold;
      #     nothing to actually fix.
      # These are the same rules that a per-alert `gh api dismiss` would cover,
      # but per reference_scorecard_dismissal_not_durable the dismissals decay
      # across weekly re-runs (SARIF fingerprint drift). Filtering at upload
      # time is durable across runs.
      # Note: `publish_results: true` above still sends the ORIGINAL (unfiltered)
      # results to the public Scorecard registry — the badge score reflects
      # reality; this filter only affects the code-scanning alert list.
      - name: Filter won't-fix rule IDs from SARIF before code-scanning upload
        run: |
          jq --argjson exclude '["BranchProtectionID","CIIBestPracticesID","CodeReviewID","DangerousWorkflowID","FuzzingID","PinnedDependenciesID","SASTID"]' \
             '(.runs[]?.results) |= map(select([.ruleId] - $exclude | length > 0))' \
             results.sarif > results.filtered.sarif
          echo "SARIF result counts before vs after filter:"
          echo "  before: $(jq '[.runs[]?.results // [] | length] | add' results.sarif)"
          echo "  after:  $(jq '[.runs[]?.results // [] | length] | add' results.filtered.sarif)"

      - name: Upload to code-scanning dashboard
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.filtered.sarif
