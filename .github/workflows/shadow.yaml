name: Shadow workloads (perf regression)

# Nightly production-traffic shadow testing (issue #82).
#
# Replays the realistic consumer workloads in
# samples/Wolfgang.Etl.SqlBulkCopy.ShadowWorkloads (BenchmarkDotNet + a real
# SQL Server via Testcontainers) against the current main HEAD, publishes the
# results to gh-pages under dev/shadow/, and leaves a commit comment when a
# tracked metric moves past the alert threshold against the previous night.
#
# The alert is advisory: the run does not fail on it. GitHub-hosted runners
# swing well past the threshold from one night to the next on this workload
# (in both directions), so a hard gate here reports runner noise, not code.
# The chart is the signal to read; latency gating returns once the workloads
# run on a quiet, dedicated runner. The run fails, and opens or updates the
# single tracking issue, only when it cannot produce a result at all.
#
# Why nightly (not pr.yaml / release.yaml):
#   - Each run pulls + starts a SQL Server container and runs BDN over 1k/100k
#     row loads — minutes of runtime and heavy IO, far too slow for per-PR CI.
#   - GitHub-hosted runners are noisy, so single measurements wobble; a nightly
#     series charted over weeks shows a real regression far more reliably than
#     one noisy PR run.
#   - A perf regression means "we merged something slow", not "the build is
#     broken" — it belongs on a daily cadence, off the merge/release critical
#     path. workflow_dispatch is provided for on-demand checks.
#
# Latency (Mean time) is the charted and alerted metric. Allocation/GC stats are
# captured and charted (MemoryDiagnoser) too.

on:
  schedule:
    - cron: '0 4 * * *' # daily 04:00 UTC
  workflow_dispatch:

# Top-level read-only default; the shadow job widens where it must.
permissions:
  contents: read

# Serialize gh-pages writes so this can't race docfx.yaml / benchmarks.yaml.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # GATE: skip the expensive run when nothing perf-relevant changed since the
  # last successful run. Manual dispatch always runs.
  # --------------------------------------------------------------------------
  gate:
    name: Decide whether to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # `gh run list` reads the Actions API
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff HEAD against the last measured commit
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          # Manual dispatch always runs, even with no changes.
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manual dispatch — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SHA of the commit the last SUCCESSFUL run measured. Empty on the
          # first ever run, or after only-failing runs — either way, run.
          last=$(gh run list --workflow shadow.yaml --branch main --status success \
                   --limit 1 --json headSha --jq '.[0].headSha // ""' \
                   -R "$GITHUB_REPOSITORY")
          if [ -z "$last" ]; then
            echo "No prior successful run — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$last" = "$HEAD_SHA" ]; then
            echo "HEAD ($HEAD_SHA) unchanged since last successful run — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only run if a perf-relevant path changed since the last measured
          # commit. `git diff --quiet` exits 0 (no diff → skip) or 1 (diff → run).
          if git diff --quiet "$last" "$HEAD_SHA" -- src samples .github/workflows/shadow.yaml; then
            echo "No perf-relevant changes since $last — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Perf-relevant changes since $last — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------
  # SHADOW: run the workloads, publish the chart, comment on a latency alert.
  # --------------------------------------------------------------------------
  shadow:
    name: Run shadow workloads & publish
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push chart + history to gh-pages
      issues: write # open or update the tracking issue when the run errors
    env:
      SAMPLE_DIR: samples/Wolfgang.Etl.SqlBulkCopy.ShadowWorkloads
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x

      - name: Build (Release)
        shell: bash
        run: dotnet build -c Release "$SAMPLE_DIR/Wolfgang.Etl.SqlBulkCopy.ShadowWorkloads.csproj"

      - name: Run shadow workloads
        working-directory: ${{ env.SAMPLE_DIR }}
        shell: bash
        # --job short bounds runtime on noisy hosted runners. Testcontainers
        # spins the SQL Server container from within the process (Docker is
        # present on ubuntu-latest).
        run: dotnet run -c Release --no-build -- --filter "*" --job short --memory --exporters json

      - name: Locate BDN report
        id: locate
        working-directory: ${{ env.SAMPLE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(BenchmarkDotNet.Artifacts/results/*-report-full-compressed.json)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::No BenchmarkDotNet JSON report found"
            exit 1
          fi
          # One benchmark class → one report; merge defensively in case more are
          # added later so github-action-benchmark still gets a single file.
          jq -s '{
            Title: "SqlBulkCopy shadow workloads",
            HostEnvironmentInfo: .[0].HostEnvironmentInfo,
            Benchmarks: [.[].Benchmarks[]]
          }' "${reports[@]}" > shadow-result.json
          echo "report=$SAMPLE_DIR/shadow-result.json" >> "$GITHUB_OUTPUT"

      - name: Publish chart & comment on latency alert
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: SqlBulkCopy shadow workloads
          tool: 'benchmarkdotnet'
          output-file-path: ${{ steps.locate.outputs.report }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/shadow
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # >20% slower than the previous night leaves a commit comment with the
          # per-benchmark table. It does not fail the run (see the header).
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false

      - name: Open or update the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          short="${HEAD_SHA:0:7}"
          # Write the body via heredoc (dedented to column 0) so no stray leading
          # whitespace turns Markdown lines into code blocks.
          cat > failure-body.md <<EOF
          The nightly shadow-workload run on \`$short\` could not produce a result (build, container start, workload or publish step errored). Latency alerts do not fail the run; this is a broken run, not a measured regression.

          - Commit: \`$HEAD_SHA\`
          - Run: $RUN_URL
          - Chart: https://${owner}.github.io/${repo}/dev/shadow/
          EOF
          # One tracking issue at a time: append to the open one if it exists,
          # otherwise open it.
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
            --label "performance-regression" \
            --search "Shadow-workload nightly run failed in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body-file failure-body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "Shadow-workload nightly run failed" \
              --label "performance-regression" \
              --body-file failure-body.md
          fi
