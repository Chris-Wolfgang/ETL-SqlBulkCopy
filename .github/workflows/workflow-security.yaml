name: Workflow Security

# Lints the GitHub Actions YAML files themselves for:
#   - syntax errors and common mistakes (actionlint)
#   - workflow-security vulnerabilities — untrusted-input injection, missing
#     permissions blocks, expression-context secret expansion, unpinned
#     third-party actions (zizmor)
#
# Complementary to CodeQL (which scans .cs source) and to S2's manual
# Actions-hardening review. Strictly additive; does not gate merge today,
# but a high-severity new finding will surface as a PR annotation.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '.zizmor.yml'
  push:
    branches: [main, vNext]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '.zizmor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        # Pinned to v1.7.7. Installation matches the maintainer's own
        # recommendation in actionlint's README: download the binary via
        # the official bash script and run it directly. Faster than a
        # Docker pull, cleaner argv handling (no container ENTRYPOINT
        # in the loop), and one fewer trust boundary.
        #
        # Script is fetched from the v1.7.7 tag for content-pinning —
        # not from main — so a future change to download-actionlint.bash
        # can't retroactively alter what this CI does.
        run: |
          curl -sSfLo /tmp/download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.7 /tmp
          /tmp/actionlint
        shell: bash

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      # SARIF upload to the Security tab requires security-events: write.
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install zizmor
        # zizmor is published to PyPI; pin to a known release for
        # reproducibility. https://woodruffw.github.io/zizmor/
        run: pip install --user 'zizmor==1.5.2'

      - name: Run zizmor (SARIF output)
        # --offline avoids GitHub API calls during the lint (no rate-limit
        # surprises on busy days). --persona auditor enables stricter rules
        # appropriate for a library shipping to the public NuGet feed.
        # --config loads .zizmor.yml explicitly: zizmor only auto-discovers
        # .github/zizmor.yml, so without this the root .zizmor.yml (where
        # accepted findings are suppressed) is silently ignored.
        run: |
          zizmor --config .zizmor.yml --offline --persona auditor --format sarif \
            .github/workflows/ > zizmor.sarif || true
        # `|| true` keeps the step from short-circuiting on findings, so the
        # full SARIF still uploads (all severities surface as PR annotations).
        # The gate step below is what actually fails the PR on high severity.

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Gate on new high-severity findings
        # Fails the PR on a NEW high-severity zizmor finding. Accepted findings
        # (e.g. pr.yaml's intentional pull_request_target) are suppressed in
        # .zizmor.yml, so anything left at high severity is genuinely new.
        shell: bash
        run: |
          set -euo pipefail
          # Guard against a false green: if zizmor failed to install/run, the
          # `|| true` above would leave zizmor.sarif missing or empty. Fail
          # here rather than reporting a clean gate on no data.
          if [ ! -s zizmor.sarif ]; then
            echo "::error::zizmor.sarif is missing or empty — zizmor did not run. Failing rather than passing on no data."
            exit 1
          fi
          if ! jq empty zizmor.sarif 2>/dev/null; then
            echo "::error::zizmor.sarif is not valid JSON — zizmor output is malformed."
            exit 1
          fi
          # zizmor maps High/Critical severity to SARIF level "error".
          high=$(jq '[.runs[].results[] | select(.level == "error")] | length' zizmor.sarif)
          echo "High-severity (level=error) zizmor findings: $high"
          if [ "$high" -gt 0 ]; then
            echo "::error::$high new high-severity zizmor finding(s). Fix them, or accept in .zizmor.yml with a rationale."
            jq -r '.runs[].results[] | select(.level == "error") | "  - \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri)"' zizmor.sarif
            exit 1
          fi
          echo "✅ No new high-severity zizmor findings."
