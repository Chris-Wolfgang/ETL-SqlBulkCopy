name: Build reproducibility

# Verifies that the deterministic-build knobs in Directory.Build.props
# (<Deterministic>, <ContinuousIntegrationBuild>, SourceLink + EmbedUntrackedSources)
# actually produce byte-identical managed assemblies when the same commit is
# built on different runners. Hard gate — a cross-OS hash difference fails the run
# and the unified diff above the error shows which outputs differ. (It was advisory
# until #176 normalized the generated sources to LF; see Directory.Build.targets.)

on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 1'   # Mondays 05:40 UTC

permissions:
  contents: read

jobs:
  build:
    name: Build + hash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build src (net8.0, Release, deterministic)
        shell: bash
        run: |
          for proj in \
            src/Wolfgang.Etl.SqlBulkCopy/Wolfgang.Etl.SqlBulkCopy.csproj
          do
            dotnet build "$proj" -c Release -f net8.0 -p:ContinuousIntegrationBuild=true
          done

      - name: Hash assemblies
        shell: bash
        run: |
          sha256sum \
            src/Wolfgang.Etl.SqlBulkCopy/bin/Release/net8.0/Wolfgang.Etl.SqlBulkCopy.dll \
            | awk '{ n = split($2, parts, "/"); print $1 "  " parts[n] }' \
            | sort > "hashes-${{ matrix.os }}.txt"
          echo "== ${{ matrix.os }} =="
          cat "hashes-${{ matrix.os }}.txt"

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-${{ matrix.os }}.txt

  compare:
    name: Compare across runners
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: hashes

      - name: Diff manifests
        shell: bash
        run: |
          ubuntu="hashes/hashes-ubuntu-latest/hashes-ubuntu-latest.txt"
          windows="hashes/hashes-windows-latest/hashes-windows-latest.txt"
          echo "== ubuntu-latest =="; cat "$ubuntu"
          echo "== windows-latest =="; cat "$windows"
          if diff -u "$ubuntu" "$windows"; then
            echo "✅ Reproducible: managed assembly hashes match across ubuntu + windows."
          else
            echo "::error::Assembly hashes differ across runners — the build is not byte-identical cross-OS. The diff above lists the outputs that differ. Investigate embedded paths / SourceLink / generated-source normalization."
            exit 1
          fi
