# zizmor baseline configuration.
#
# Suppress accepted-as-intentional findings here, with a rationale comment.
# Everything not listed is subject to the workflow-security gate: a new
# high-severity finding fails the PR (see .github/workflows/workflow-security.yaml).
#
# Format: https://docs.zizmor.sh/configuration/

rules:
  dangerous-triggers:
    ignore:
      # pr.yaml uses `pull_request_target` intentionally. PR validation must run
      # from main's trusted copy of the workflow (with the PR checked out
      # read-only for scanning), not the PR-author-controlled HEAD — that is the
      # whole point of the guard. Documented in the pr.yaml header.
      - pr.yaml

  template-injection:
    ignore:
      # codeql.yaml's "Complete Security Scan" summary step interpolates step
      # outcomes/outputs (steps.check-csharp.outcome, steps.build.outcome,
      # steps.perform-codeql-analysis.outcome, steps.check-csharp.outputs.has-csharp)
      # into a pwsh here-string. Those values come from prior steps we control in
      # the same workflow — the check-csharp step emits a boolean literal, the
      # other two `.outcome` values are the fixed enum {success|failure|cancelled|skipped}
      # set by the runner. None of them is attacker-controllable in the sense the
      # rule is written for. Rewriting via env: would obscure the summary logic
      # without changing the risk surface.
      - codeql.yaml

  excessive-permissions:
    ignore:
      # scorecard.yaml declares top-level `permissions: read-all` because the
      # Scorecard action itself needs to inspect many read-scoped repository
      # facets (branch protection, workflow contents, releases, code, actions,
      # security events for its own upload). The write scopes it actually needs
      # (security-events: write, id-token: write for OIDC publish) are declared
      # narrowly on the analysis job. This is the pattern documented in
      # ossf/scorecard-action's own README.
      - scorecard.yaml
